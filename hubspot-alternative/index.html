  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"c8497f32-e810-4eec-abad-81e047fbbf9a\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<title>HubSpot Alternative for Small Business | Counteroffer CRM<\u002Ftitle>\n<meta name=\"description\" content=\"Looking for a HubSpot alternative? Counteroffer is a custom-built, white-label CRM with sequences, email marketing, quotes, invoicing and e-signature included, with no hubs, contact tiers or onboarding fees. From $20,000 a year.\">\n<meta name=\"robots\" content=\"index, follow, max-image-preview:large\">\n<link rel=\"canonical\" href=\"https://www.counteroffercrm.com/hubspot-alternative/\">\n<meta property=\"og:type\" content=\"article\">\n<meta property=\"og:site_name\" content=\"Counteroffer\">\n<meta property=\"og:title\" content=\"The HubSpot alternative for small business\">\n<meta property=\"og:description\" content=\"HubSpot sells hubs. Counteroffer builds you the whole CRM, with your name on it.\">\n<meta property=\"og:url\" content=\"https://www.counteroffercrm.com/hubspot-alternative/\">\n<meta property=\"og:image\" content=\"https://www.counteroffercrm.com/assets/og-counteroffer.png\">\n<meta name=\"twitter:card\" content=\"summary_large_image\">\n<meta name=\"twitter:image\" content=\"https://www.counteroffercrm.com/assets/og-counteroffer.png\">\n<script type=\"application/ld+json\">{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"WebPage\",\"name\":\"HubSpot Alternative for Small Business\",\"url\":\"https://www.counteroffercrm.com/hubspot-alternative/\",\"about\":{\"@type\":\"SoftwareApplication\",\"name\":\"Counteroffer\"},\"isPartOf\":{\"@type\":\"WebSite\",\"name\":\"Counteroffer\",\"url\":\"https://www.counteroffercrm.com/\"}},{\"@type\":\"BreadcrumbList\",\"itemListElement\":[{\"@type\":\"ListItem\",\"position\":1,\"name\":\"Counteroffer\",\"item\":\"https://www.counteroffercrm.com/\"},{\"@type\":\"ListItem\",\"position\":2,\"name\":\"HubSpot alternative\",\"item\":\"https://www.counteroffercrm.com/hubspot-alternative/\"}]},{\"@type\":\"FAQPage\",\"mainEntity\":[{\"@type\":\"Question\",\"name\":\"What is the best HubSpot alternative for a small business?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"The best alternative removes the hub, seat and contact-tier math. Counteroffer includes sales, marketing, quotes, invoicing and e-signature in one license. It is custom-built and white-labelled for your company.\"}},{\"@type\":\"Question\",\"name\":\"How much does HubSpot cost for a small business?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"At published 2026 prices, six Sales Hub Professional seats cost $6,480 a year and Marketing Hub Professional costs $10,680 a year, plus $4,500 in mandatory onboarding fees, for about $21,660 in year one before contact tiers, quoting add-ons and credits.\"}},{\"@type\":\"Question\",\"name\":\"Can we migrate from HubSpot to Counteroffer?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Yes. Contacts, companies, deals and history are exported from HubSpot and mapped into your Counteroffer build during setup, so your team starts with its full record.\"}},{\"@type\":\"Question\",\"name\":\"Why choose Counteroffer over HubSpot?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"HubSpot prices rise with seats, hubs and marketing contacts. Counteroffer is one custom build with your brand on it, and there is no contact tier to outgrow. It starts at $20,000 a year for the full platform, with optional support.\"}}]}]}<\u002Fscript>\n<style>/* Webfonts are served from Google Fonts — the site links them directly in every page head.\n   Instrument Serif (display), IBM Plex Sans (UI/body), IBM Plex Mono (labels, kickers, data). */\n/* cyrillic-ext */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"bccb7a1b-23e4-4162-818e -on-dark-2:#a8a29a;\n--line-dark:rgba(255,255,255,.14);\n}\n\n:root{\n--display:'Instrument Serif',Georgia,'Times New Roman',serif; /* @kind font */\n--sans:'IBM Plex Sans','Helvetica Neue',system-ui,sans-serif; /* @kind font */\n--mono:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace; /* @kind font */\n\n/* display / serif headings — clamped, viewport-fluid */\n--fs-h1:clamp(31px,3.9vw,49px); /* @kind font */\n--fs-h-lg:clamp(29px,3.6vw,46px); /* @kind font */\n--fs-h-md:clamp(24px,2.7vw,34px); /* @kind font */\n--fs-h-sm:clamp(18.5px,2vw,24px); /* @kind font */\n--fs-serif-19:19px; /* @kind font */\n--fs-serif-18:18px; /* @kind font */\n\n/* body sans */\n--fs-lede:15.5px; /* @kind font */\n--fs-lede-lg:16.5px; /* @kind font */\n--fs-body:14px; /* @kind font */\n--fs-body-sm:13.5px; /* @kind font */\n--fs-body-xs:13px; /* @kind font */\n--fs-nav:12.5px; /* @kind font */\n\n/* mono labels */\n--fs-mono-kicker:10.5px; /* @kind font */\n--fs-mono-label:9px; /* @kind font */\n--fs-mono-plate:9.5px; /* @kind font */\n--fs-mono-btn:11px; /* @kind font */\n\n/* line heights */\n--lh-display:1.1; /* @kind font */\n--lh-heading:1.18; /* @kind font */\n--lh-lede:1.7; /* @kind font */\n--lh-body:1.66; /* @kind font */\n--lh-prose:1.74; /* @kind font */\n\n/* tracking */\n--ls-display:-.016em; /* @kind font */\n--ls-display-tight:-.021em; /* @kind font */\n--ls-mono-kicker:.17em; /* @kind font */\n--ls-mono-btn:.13em; /* @kind font */\n--ls-mono-label:.16em; /* @kind font */\n\n/* weights — sans only; display is always 400 */\n--fw-light:300; /* @kind font */\n--fw-regular:400; /* @kind font */\n--fw-medium:500; /* @kind font */\n--fw-semibold:600; /* @kind font */\n}\n\n:root{\n/* section rhythm */\n--sec-y:92px;\n--sec-y-sm:64px;\n--band-y:68px;\n\n/* container */\n--maxw:1180px;\n--gutter:44px;\n--gutter-sm:22px;\n\n/* inner spacing steps used across cards, plates and forms */\n--sp-1:4px;\n--sp-2:8px;\n--sp-3:13px;\n--sp-4:18px;\n--sp-5:24px;\n--sp-6:28px;\n--sp-7:34px;\n--sp-8:44px;\n--sp-9:56px;\n--sp-10:70px;\n\n/* grid gaps */\n--gap-hairline:1px;\n--gap-card:1px;\n--gap-col:56px;\n\n/* control padding */\n--btn-y:17px;\n--btn-x:32px;\n--input-y:12px;\n--input-x:13px;\n\n/* radius — the brand is square. nothing rounds except the live dot. */\n--radius:0px;\n--radius-dot:50%;\n\n/* minimum touch target used on option chips */\n--tap-min:44px; /* @kind spacing */\n}\n\n:root{\n--sh-1:0 1px 2px rgba(14,14,13,.04);\n--sh-2:0 12px 30px -18px rgba(14,14,13,.30),0 2px 6px rgba(14,14,13,.03);\n--sh-3:0 30px 60px -34px rgba(14,14,13,.45),0 4px 12px rgba(14,14,13,.04);\n\n/* focus ring */\n--focus-ring:0 0 0 3px var(--accent-soft); /* @kind other */\n--focus-outline:2px solid var(--accent); /* @kind other */\n\n/* blueprint grid overlay used on heroes and dark bands */\n--grid-line-light:rgba(14,14,13,.032); /* @kind other */\n--grid-line-dark:rgba(255,255,255,.038); /* @kind other */\n--grid-size:86px; /* @kind other */\n--grid-size-dark:64px; /* @kind other */\n\n/* plate surface */\n--plate-bg:linear-gradient(168deg,#fff,var(--paper-2) 62%,var(--paper-3)); /* @kind other */\n--form-bg:linear-gradient(168deg,#fff,var(--paper-2)); /* @kind other */\n}\n\n:root{\n--ease:cubic-bezier(.22,.7,.24,1); /* @kind other */\n--dur-fast:.22s; /* @kind other */\n--dur:.26s; /* @kind other */\n--dur-slow:.34s; /* @kind other */\n--dur-slower:.4s; /* @kind other */\n}\n\n:root{\n/* surfaces */\n--surface-page:var(--paper);\n--surface-raised:var(--paper-2);\n--surface-sunken:var(--paper-3);\n--surface-card:var(--paper);\n--surface-plate:var(--plate-bg); /* @kind other */\n--surface-inverse:var(--ink);\n--surface-accent-wash:var(--accent-soft);\n\n/* text */\n--text-heading:var(--ink);\n--text-body:var(--ink-2);\n--text-muted:var(--mute);\n--text-accent:var(--accent);\n--text-link:var(--accent-2);\n--text-inverse:var(--on-dark);\n--text-inverse-body:var(--on-dark-2);\n\n/* borders */\n--border-default:var(--line);\n--border-faint:var(--line-3);\n--border-accent:var(--line-2);\n--border-strong:var(--ink);\n\n/* controls */\n--btn-solid-bg:var(--ink);\n--btn-solid-fg:#fff;\n--btn-solid-bg-hover:var(--accent);\n--btn-outline-border:var(--line-2);\n--btn-outline-fg:var(--ink);\n--field-bg:var(--paper);\n--field-border:var(--line);\n--field-border-focus:var(--accent);\n}\n\n/* Base element defaults — mirror the live site so a bare page looks right. */\nhtml,body{background:var(--surface-page);color:var(--text-heading);font-family:var(--sans);font-weight:var(--fw-regular);font-feature-settings:\"kern\" 1,\"liga\" 1;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}\nh1,h2,h3,h4{font-family:var(--display);font-weight:400;letter-spacing:-.014em;text-wrap:balance}\np{text-wrap:pretty}\na{color:inherit;text-decoration:none}\na:hover{color:var(--accent)}\n::selection{background:var(--accent);color:#fff}\n:focus-visible{outline:var(--focus-outline);outline-offset:3px}\n\n<\u002Fstyle>\n<script src=\"274a99f1-d685-4c6f-bf01-18d23d209185\"><\u002Fscript>\n<script async=\"\" src=\"dc64b117-0f0f-4595-a19b-1181903d73f3\"><\u002Fscript>\n<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-XXXXXXXXXX');<\u002Fscript>\n<style>body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}h1,h2,h3,p,ul{margin:0}a{color:var(--ink);text-decoration:none}a:hover{color:var(--accent)}<\u002Fstyle>\n<\u002Fhelmet>\n<div>\n<nav aria-label=\"Main\" style=\"position:sticky;top:0;z-index:20;background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)\">\n  <div style=\"max-width:var(--maxw);margin:0 auto;padding:14px var(--gutter-sm);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:nowrap\">\n    <a href=\"/\" aria-label=\"Counteroffer home\" style=\"display:flex;align-items:center;gap:11px;line-height:1\"><span aria-hidden=\"true\" style=\"width:40px;height:40px;background:var(--ink);display:grid;place-items:center;font-family:'Segoe UI Symbol','Apple Symbols','Noto Sans Symbols 2','DejaVu Sans',serif;font-size:26px;line-height:1;color:var(--accent-3)\">♛︎<\u002Fspan><span style=\"display:flex;flex-direction:column;gap:5px\"><span style=\"font-family:var(--sans);font-weight:600;font-size:22px;letter-spacing:-.045em;color:var(--ink)\">counter<span style=\"color:var(--accent)\">offer<\u002Fspan><\u002Fspan><span style=\"font-family:var(--mono);font-size:7.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute)\">by The Chief Negotiators<\u002Fspan><\u002Fspan><\u002Fa>\n    <div style=\"display:flex;align-items:center;gap:26px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase\">\n      <a href=\"/#demo\" style=\"background:var(--ink);color:#fff;padding:12px 18px;font-weight:500;white-space:nowrap\" style-hover=\"background:var(--accent);color:#fff\">Book a demo<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<header style=\"position:relative;overflow:hidden;border-bottom:1px solid var(--line);padding:64px 0 56px\">\n  <span aria-hidden=\"true\" style=\"position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(var(--line-3) 1px,transparent 1px),linear-gradient(90deg,var(--line-3) 1px,transparent 1px);background-size:86px 86px;-webkit-mask-image:radial-gradient(ellipse 60% 70% at 100% 0%,#000,transparent 70%);mask-image:radial-gradient(ellipse 60% 70% at 100% 0%,#000,transparent 70%)\"><\u002Fspan>\n  <div style=\"position:relative;max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter-sm)\">\n    <nav aria-label=\"Breadcrumb\" style=\"font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;gap:8px;margin-bottom:22px\"><a href=\"/\" style=\"color:var(--mute)\">Counteroffer<\u002Fa><span>/<\u002Fspan><span style=\"color:var(--accent)\">HubSpot alternative<\u002Fspan><\u002Fnav>\n    <h1 style=\"font-family:var(--display);font-weight:400;font-size:clamp(40px,6vw,68px);line-height:1.04;letter-spacing:var(--ls-display);max-width:20ch;text-wrap:balance\">The HubSpot alternative for small business. <em style=\"color:var(--accent)\">No hubs to stack.<\u002Fem><\u002Fh1>\n    <p style=\"font-size:17px;line-height:1.7;color:var(--ink-2);font-weight:300;max-width:62ch;margin-top:22px\">HubSpot is priced by hub, by seat and by marketing contact, with onboarding fees on every Professional tier. Counteroffer is one custom-built CRM for small teams, with pipeline, Outlook sync, email marketing, quotes, invoicing, e-signature and automated prospecting included, branded as your own.<\u002Fp>\n    <div style=\"display:flex;gap:16px;flex-wrap:wrap;margin-top:30px;align-items:center\">\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Button\" href=\"/#demo\" hint-size=\"220px,50px\">Book a 20-minute demo →<\u002Fx-import>\n      <a href=\"#compare\" style=\"font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid var(--line-2);padding-bottom:6px\">See the comparison →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"compare\" style=\"padding:var(--sec-y-sm) 0;background:var(--paper-2);border-bottom:1px solid var(--line)\">\n  <div style=\"max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter-sm);display:flex;flex-direction:column;gap:26px\">\n    <div>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Kicker\" hint-size=\"auto,14px\">HubSpot vs Counteroffer · 6-person team<\u002Fx-import>\n      <h2 style=\"font-family:var(--display);font-weight:400;font-size:var(--fs-h-lg);line-height:1.1;letter-spacing:var(--ls-display);margin-top:16px;max-width:24ch;text-wrap:balance\">What small teams pay for HubSpot. <em style=\"color:var(--accent)\">And what is still missing.<\u002Fem><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"overflow-x:auto;border:1px solid var(--line);background:#fff\">\n      <sc-raw-table style=\"width:100%;min-width:620px;border-collapse:collapse;font-size:14px\">\n        <sc-raw-thead><sc-raw-tr style=\"background:var(--paper-3);font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;text-align:left\"><sc-raw-th style=\"padding:14px 18px;font-weight:500\">Capability<\u002Fsc-raw-th><sc-raw-th style=\"padding:14px 18px;font-weight:500;color:var(--mute)\">HubSpot stack<\u002Fsc-raw-th><sc-raw-th style=\"padding:14px 18px;font-weight:500;color:var(--accent)\">Counteroffer<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody style=\"font-weight:300\">\n          <sc-raw-tr style=\"border-top:1px solid var(--line)\"><sc-raw-td style=\"padding:14px 18px;font-weight:500\">CRM seats<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 18px\">Sales Hub Pro · $6,480 / yr<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 18px;font-family:var(--mono);font-size:12px\">Included<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"border-top:1px solid var(--line)\"><sc-raw-td style=\"padding:14px 18px;font-weight:500\">Marketing automation<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 18px\">Marketing Hub Pro · $10,680 / yr<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 18px;font-family:var(--mono);font-size:12px\">Included<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"border-top:1px solid var(--line)\"><sc-raw-td style=\"padding:14px 18px;font-weight:500\">Onboarding fees<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 18px\">Mandatory · $4,500 year one<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 18px;font-family:var(--mono);font-size:12px\">Included<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"border-top:1px solid var(--line)\"><sc-raw-td style=\"padding:14px 18px;font-weight:500\">Quotes<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 18px;color:var(--accent-2)\">Paid add-on<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 18px;font-family:var(--mono);font-size:12px\">Included<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"border-top:1px solid var(--line)\"><sc-raw-td style=\"padding:14px 18px;font-weight:500\">Invoices, LOIs &amp; purchase orders<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 18px;color:var(--accent-2)\">Separate tool<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 18px;font-family:var(--mono);font-size:12px\">Included<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"border-top:1px solid var(--line)\"><sc-raw-td style=\"padding:14px 18px;font-weight:500\">Events &amp; RSVP pages<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 18px;color:var(--accent-2)\">Separate tool<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 18px;font-family:var(--mono);font-size:12px\">Included<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"border-top:1px solid var(--line)\"><sc-raw-td style=\"padding:14px 18px;font-weight:500\">Your company's name on the CRM<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 18px;color:var(--accent-2)\">HubSpot product<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 18px;font-family:var(--mono);font-size:12px\">Built for you<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"border-top:1px solid var(--ink);background:var(--accent-soft)\"><sc-raw-td style=\"padding:16px 18px;font-weight:600\">Every year<\u002Fsc-raw-td><sc-raw-td style=\"padding:16px 18px;font-family:var(--display);font-size:26px;text-decoration:line-through;text-decoration-color:var(--accent)\">$21,660<\u002Fsc-raw-td><sc-raw-td style=\"padding:16px 18px;font-family:var(--display);font-size:26px;color:var(--accent)\">From $20,000<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fdiv>\n    <p style=\"font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);line-height:1.7\">Published list prices, annual billing, 2026 · HubSpot pricing pages · Year one, before contact tiers and credits · Confirm current terms with each vendor<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:var(--sec-y-sm) 0;border-bottom:1px solid var(--line)\">\n  <div style=\"max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter-sm);display:flex;flex-direction:column;gap:28px\">\n    <h2 style=\"font-family:var(--display);font-weight:400;font-size:var(--fs-h-lg);line-height:1.1;letter-spacing:var(--ls-display);max-width:24ch;text-wrap:balance\">Why small businesses outgrow HubSpot. <em style=\"color:var(--accent)\">Three reasons.<\u002Fem><\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:1px;background:var(--line);border:1px solid var(--line)\">\n      <div style=\"background:#fff;padding:28px;display:flex;flex-direction:column;gap:10px\"><span style=\"font-family:var(--mono);font-size:11px;color:var(--accent)\">01 · Cost<\u002Fspan><h3 style=\"font-family:var(--display);font-weight:400;font-size:24px;line-height:1.2\">The free CRM is the start of the bill<\u002Fh3><p style=\"font-size:14px;line-height:1.7;font-weight:300;color:var(--ink-2)\">Sequences, workflows and reporting sit behind Professional, and marketing is a second hub priced by contacts. Counteroffer is one license.<\u002Fp><\u002Fdiv>\n      <div style=\"background:#fff;padding:28px;display:flex;flex-direction:column;gap:10px\"><span style=\"font-family:var(--mono);font-size:11px;color:var(--accent)\">02 · Complexity<\u002Fspan><h3 style=\"font-family:var(--display);font-weight:400;font-size:24px;line-height:1.2\">Your list grows, so does the bill<\u002Fh3><p style=\"font-size:14px;line-height:1.7;font-weight:300;color:var(--ink-2)\">Marketing contacts are billed in blocks, so a growing list pushes you into the next tier. Counteroffer has no contact tier to outgrow.<\u002Fp><\u002Fdiv>\n      <div style=\"background:#fff;padding:28px;display:flex;flex-direction:column;gap:10px\"><span style=\"font-family:var(--mono);font-size:11px;color:var(--accent)\">03 · Adoption<\u002Fspan><h3 style=\"font-family:var(--display);font-weight:400;font-size:24px;line-height:1.2\">Reps skip data entry<\u002Fh3><p style=\"font-size:14px;line-height:1.7;font-weight:300;color:var(--ink-2)\">Counteroffer logs every email, call and meeting automatically and chases stale deals, so the record is complete without extra clicks.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:var(--sec-y-sm) 0;background:var(--paper-2);border-bottom:1px solid var(--line)\">\n  <div style=\"max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter-sm);display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start\">\n    <div style=\"flex:1 1 280px;max-width:380px\">\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Kicker\" hint-size=\"auto,14px\">Switching from HubSpot<\u002Fx-import>\n      <h2 style=\"font-family:var(--display);font-weight:400;font-size:var(--fs-h-md);line-height:1.12;letter-spacing:var(--ls-display);margin-top:16px\">Questions, <em style=\"color:var(--accent)\">answered.<\u002Fem><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"flex:2 1 520px;min-width:0;border-top:1px solid var(--line-2)\">\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.FaqItem\" n=\"01\" question=\"What is the best HubSpot alternative for a small business?\" hint-size=\"100%,72px\"><p style=\"font-size:14px;line-height:1.7;font-weight:300;color:var(--ink-2)\">The best alternative removes the hub, seat and contact-tier math. Counteroffer includes sales, marketing, quotes, invoicing and e-signature in one license. It is custom-built and white-labelled for your company.<\u002Fp><\u002Fx-import>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.FaqItem\" n=\"02\" question=\"How much does HubSpot cost for a small business?\" hint-size=\"100%,72px\"><p style=\"font-size:14px;line-height:1.7;font-weight:300;color:var(--ink-2)\">At published 2026 prices, six Sales Hub Professional seats cost $6,480 a year and Marketing Hub Professional costs $10,680 a year, plus $4,500 in mandatory onboarding fees, for about $21,660 in year one before contact tiers, quoting add-ons and credits.<\u002Fp><\u002Fx-import>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.FaqItem\" n=\"03\" question=\"Can we migrate from HubSpot to Counteroffer?\" hint-size=\"100%,72px\"><p style=\"font-size:14px;line-height:1.7;font-weight:300;color:var(--ink-2)\">Yes. Contacts, companies, deals and history are exported from HubSpot and mapped into your Counteroffer build during setup, so your team starts with its full record.<\u002Fp><\u002Fx-import>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.FaqItem\" n=\"04\" question=\"Why choose Counteroffer over HubSpot?\" hint-size=\"100%,72px\"><p style=\"font-size:14px;line-height:1.7;font-weight:300;color:var(--ink-2)\">HubSpot prices rise with seats, hubs and marketing contacts. Counteroffer is one custom build with your brand on it, and there is no contact tier to outgrow. It starts at $20,000 a year for the full platform, with optional support.<\u002Fp><\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"position:relative;overflow:hidden;padding:var(--sec-y-sm) 0;background:var(--paper-3)\">\n  <div style=\"position:relative;max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter-sm);display:flex;flex-wrap:wrap;gap:28px;justify-content:space-between;align-items:center\">\n    <h2 style=\"font-family:var(--display);font-weight:400;font-size:var(--fs-h-lg);line-height:1.1;letter-spacing:var(--ls-display);max-width:22ch;text-wrap:balance\">Bring your HubSpot bill. <em style=\"color:var(--accent)\">We will bring the counteroffer.<\u002Fem><\u002Fh2>\n    <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Button\" href=\"/#demo\" hint-size=\"220px,50px\">Book my demo →<\u002Fx-import>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"border-top:1px solid var(--line);padding:32px 0\">\n  <div style=\"max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter-sm);display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)\">\n    <span>© 2026 Chief Negotiators LLC · St. Petersburg, Florida<\u002Fspan>\n    <nav aria-label=\"Footer\" style=\"display:flex;gap:6px 22px;flex-wrap:wrap;line-height:2.6\"><a href=\"/salesforce-alternative/\" style=\"color:var(--mute)\">Salesforce alternative<\u002Fa><a href=\"/white-label-crm/\" style=\"color:var(--mute)\">White-label CRM<\u002Fa><a href=\"/real-estate-crm/\" style=\"color:var(--mute)\">Real estate CRM<\u002Fa><a href=\"/crm-for-agencies/\" style=\"color:var(--mute)\">CRM for agencies<\u002Fa><a href=\"/crm-for-consultants/\" style=\"color:var(--mute)\">CRM for consultants<\u002Fa><\u002Fnav>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
