=\"padding:13px 16px;font-weight:500\">Event invites &amp; RSVPs<\u002Fdiv><div style=\"padding:13px 16px;color:var(--mute);font-weight:300;text-decoration:line-through;text-decoration-color:var(--accent)\">Event platform<\u002Fdiv><div style=\"padding:13px 16px;font-family:var(--mono);font-size:11px;color:var(--accent-2)\">— Included<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,.8fr);border-top:1px solid var(--line);font-size:13.5px;align-items:center;flex:1 1 auto\"><div style=\"padding:13px 16px;font-weight:500\">Logging calls &amp; emails<\u002Fdiv><div style=\"padding:13px 16px;color:var(--mute);font-weight:300;text-decoration:line-through;text-decoration-color:var(--accent)\">Rep time, every day<\u002Fdiv><div style=\"padding:13px 16px;font-family:var(--mono);font-size:11px;color:var(--accent-2)\">— Automatic<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;border-top:1px solid var(--line-2);background:var(--accent-soft);padding:16px\">\n        <div style=\"flex:1 1 220px;font-family:var(--display);font-size:20px;line-height:1.2\">Our counteroffer: one build, one license. <em style=\"color:var(--accent)\">Every tool above.<\u002Fem><\u002Fdiv>\n        <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Button\" variant=\"solid\" href=\"#demo\" hint-size=\"200px,48px\">Compare my current CRM →<\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"white-label\" style=\"padding:var(--sec-y-sm) 0;background:var(--paper-2);border-bottom:1px solid var(--line)\">\n  <div style=\"max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter-sm);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:48px;align-items:center\">\n    <div>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.SectionMarker\" label=\"White-Label CRM\" hint-size=\"100%,16px\"><\u002Fx-import>\n      <h2 style=\"font-family:var(--display);font-weight:400;font-size:var(--fs-h-lg);line-height:1.1;letter-spacing:var(--ls-display);margin-top:24px;max-width:24ch;text-wrap:balance\">Salesforce puts its logo on your screen. <em style=\"color:var(--accent)\">We put yours.<\u002Fem><\u002Fh2>\n      <p style=\"font-size:15.5px;line-height:1.7;color:var(--ink-2);font-weight:300;margin-top:16px;max-width:52ch\">Every Counteroffer build is a branded CRM for your company — your name, logo, colours and mailboxes. Your team logs into <span style=\"color:var(--ink);font-weight:500\">your<\u002Fspan> CRM. Your clients see <span style=\"color:var(--ink);font-weight:500\">your<\u002Fspan> brand on every quote, invoice and invitation.<\u002Fp>\n      <ul style=\"list-style:none;padding:0;display:grid;gap:10px;margin-top:20px\">\n        <li style=\"display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14.5px;line-height:1.55;color:var(--ink-2);font-weight:300\"><span style=\"font-family:var(--mono);color:var(--accent)\">—<\u002Fspan><span>Your company name and logo on the login, app and emails<\u002Fspan><\u002Fli>\n        <li style=\"display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14.5px;line-height:1.55;color:var(--ink-2);font-weight:300\"><span style=\"font-family:var(--mono);color:var(--accent)\">—<\u002Fspan><span>Branded quotes, LOIs, invoices and RSVP pages<\u002Fspan><\u002Fli>\n        <li style=\"display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14.5px;line-height:1.55;color:var(--ink-2);font-weight:300\"><span style=\"font-family:var(--mono);color:var(--accent)\">—<\u002Fspan><span>Run several brands, each with its own look, from one platform<\u002Fspan><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:14px\">\n      <div style=\"border:1px solid var(--line);box-shadow:var(--sh-2);background:#fff;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)\">\n        <div style=\"background:#16323a;color:#fff;padding:24px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;min-height:200px\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:30px;height:30px;background:#e6b980;color:#16323a;display:grid;place-items:center;font-weight:700;font-size:14px\">H<\u002Fspan><span style=\"font-weight:600;font-size:14px\">Harborline<\u002Fspan><\u002Fdiv><div style=\"font-size:20px;font-weight:600;line-height:1.2\">Welcome back to Harborline CRM.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:24px;display:flex;flex-direction:column;gap:10px;justify-content:center\"><div style=\"font-size:11px;color:var(--mute)\">Work email<\u002Fdiv><div style=\"border:1px solid var(--line);padding:10px;font-size:12px;color:var(--mute)\">you@harborline.com<\u002Fdiv><div style=\"background:#16323a;color:#fff;padding:10px;text-align:center;font-size:12px;font-weight:600\">Sign in<\u002Fdiv><div style=\"font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:4px\"><span style=\"display:inline-flex;align-items:center;gap:5px\">Built by <span aria-hidden=\"true\" style=\"width:13px;height:13px;background:var(--ink);display:grid;place-items:center;font-family:'Segoe UI Symbol','Apple Symbols','Noto Sans Symbols 2','DejaVu Sans',serif;line-height:1;font-size:9px;color:var(--accent-3);flex:none\">♛︎<\u002Fspan> counteroffer<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid var(--line);box-shadow:var(--sh-2);background:#fff;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)\">\n        <div style=\"background:#f1ebe3;color:#3b2a4a;padding:24px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;min-height:180px\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:30px;height:30px;border-radius:50%;background:#3b2a4a;color:#f1ebe3;display:grid;place-items:center;font-weight:700;font-size:14px\">P<\u002Fspan><span style=\"font-weight:600;font-size:14px\">Pinecrest Advisory<\u002Fspan><\u002Fdiv><div style=\"font-size:19px;font-weight:600;line-height:1.2\">Good morning, Casey.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:24px;display:flex;flex-direction:column;gap:10px;justify-content:center\"><div style=\"font-size:11px;color:var(--mute)\">Today<\u002Fdiv><div style=\"font-size:13px\"><strong>4<\u002Fstrong> follow-ups · <strong>2<\u002Fstrong> proposals viewed<\u002Fdiv><div style=\"background:#3b2a4a;color:#fff;padding:10px;text-align:center;font-size:12px;font-weight:600\">Open pipeline<\u002Fdiv><div style=\"font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:4px\"><span style=\"display:inline-flex;align-items:center;gap:5px\">Built by <span aria-hidden=\"true\" style=\"width:13px;height:13px;background:var(--ink);display:grid;place-items:center;font-family:'Segoe UI Symbol','Apple Symbols','Noto Sans Symbols 2','DejaVu Sans',serif;line-height:1;font-size:9px;color:var(--accent-3);flex:none\">♛︎<\u002Fspan> counteroffer<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)\">Two example client builds · illustrative<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"features\" style=\"padding:var(--sec-y-sm) 0;background:var(--paper);border-bottom:1px solid var(--line)\">\n  <div style=\"max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter-sm)\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:24px 48px;align-items:end;margin-bottom:32px\">\n      <div>\n        <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.SectionMarker\" label=\"CRM Features\" hint-size=\"100%,16px\"><\u002Fx-import>\n        <h2 style=\"font-family:var(--display);font-weight:400;font-size:var(--fs-h-lg);line-height:1.1;letter-spacing:var(--ls-display);margin-top:24px;max-width:24ch;text-wrap:balance\">Every CRM feature a small team needs. <em style=\"color:var(--accent)\">One login.<\u002Fem><\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font-size:15px;line-height:1.7;color:var(--ink-2);font-weight:300;max-width:52ch\">Contact management, sales pipeline, email automation, quoting and reporting — built as one system, so every email, quote and signature lands on the right deal.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:1px;padding:1px\" data-g3=\"\">\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Card\" kicker=\"01 · Contact management\" title=\"Contacts &amp; accounts\" cta=\"{{ nul }}\" style=\"{{ cellStyle }}\" hint-size=\"100%,180px\">Companies and their people, always linked and never duplicated. Type-to-search everything, clear ownership and automatic enrichment.<\u002Fx-import>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Card\" kicker=\"02 · Sales pipeline\" title=\"Pipeline &amp; deal tracking\" cta=\"{{ nul }}\" style=\"{{ cellStyle }}\" hint-size=\"100%,180px\">Opportunity stages with value and expected close in view. Commission only counts once the deposit is received — no paper wins.<\u002Fx-import>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Card\" kicker=\"03 · Activity tracking\" title=\"Automatic activity logging\" cta=\"{{ nul }}\" style=\"{{ cellStyle }}\" hint-size=\"100%,180px\">Every email, call and meeting matched to the right contact and filed. Replies are detected and flagged. No end-of-day data entry.<\u002Fx-import>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Card\" kicker=\"04 · Outlook CRM\" title=\"Outlook &amp; calendar sync\" cta=\"{{ nul }}\" style=\"{{ cellStyle }}\" hint-size=\"100%,180px\">Two-way Microsoft Outlook sync every few minutes and calendar sync every 15. Each rep connects their own mailbox, across brands.<\u002Fx-import>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Card\" kicker=\"05 · Email marketing\" title=\"Campaigns &amp; drip sequences\" cta=\"{{ nul }}\" style=\"{{ cellStyle }}\" hint-size=\"100%,180px\">Branded templates, sequences that stop when someone replies, open and click tracking, campaign reports and compliant opt-outs.<\u002Fx-import>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Card\" kicker=\"06 · Quotes &amp; e-signature\" title=\"Quotes, RFQs &amp; DocuSign\" cta=\"{{ nul }}\" style=\"{{ cellStyle }}\" hint-size=\"100%,180px\">A reusable quote catalog, RFQ handling, tracked document sharing and DocuSign e-signature recorded back on the deal.<\u002Fx-import>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Card\" kicker=\"07 · Referral tracking\" title=\"Referrals &amp; partners\" cta=\"{{ nul }}\" style=\"{{ cellStyle }}\" hint-size=\"100%,180px\">Log who sent whom, keep partners beside your pipeline, and follow every introduction through to the revenue it produced.<\u002Fx-import>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Card\" kicker=\"08 · Lead generation\" title=\"Automated prospecting\" cta=\"{{ nul }}\" style=\"{{ cellStyle }}\" hint-size=\"100%,180px\">Prospecting agents scan your market every business morning, detect buying signals and drop qualified prospects into the pipeline.<\u002Fx-import>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Card\" kicker=\"09 · Sales reporting\" title=\"Team performance &amp; digests\" cta=\"{{ nul }}\" style=\"{{ cellStyle }}\" hint-size=\"100%,180px\">A cross-brand leaderboard, a 6:30am morning digest, follow-up nudges and credit rules that match how your comp plan works.<\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"modules\" style=\"padding:var(--sec-y-sm) 0;background:var(--paper-2);border-bottom:1px solid var(--line)\">\n  <div style=\"max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter-sm)\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:24px 48px;align-items:end;margin-bottom:32px\">\n      <div>\n        <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.SectionMarker\" label=\"Beyond The CRM\" hint-size=\"100%,16px\"><\u002Fx-import>\n        <h2 style=\"font-family:var(--display);font-weight:400;font-size:var(--fs-h-lg);line-height:1.1;letter-spacing:var(--ls-display);margin-top:24px;max-width:24ch;text-wrap:balance\">Six tools you would buy separately. <em style=\"color:var(--accent)\">Already inside.<\u002Fem><\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font-size:15px;line-height:1.7;color:var(--ink-2);font-weight:300;max-width:52ch\">Invoicing, finance, document sets, client events, prospect lists and on-brand design — running on the same records as your pipeline.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:1px;padding:1px\">\n      <article style=\"outline:1px solid var(--line);background:#fff;padding:26px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)\">Sales Hub<\u002Fdiv>\n        <h3 style=\"font-family:var(--display);font-weight:400;font-size:22px;line-height:1.2\">LOIs, invoices &amp; purchase orders<\u002Fh3>\n        <p style=\"font-size:13.5px;line-height:1.64;color:var(--ink-2);font-weight:300\">Send letters of intent, billable invoices and blanket POs with shipping schedules. The customer fills, agrees and signs — and you see every view.<\u002Fp>\n      <\u002Farticle>\n      <article style=\"outline:1px solid var(--line);background:#fff;padding:26px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)\">Finance<\u002Fdiv>\n        <h3 style=\"font-family:var(--display);font-weight:400;font-size:22px;line-height:1.2\">Cash, margin &amp; receivables<\u002Fh3>\n        <p style=\"font-size:13.5px;line-height:1.64;color:var(--ink-2);font-weight:300\">Connect bank and card accounts, reconcile against invoices and bills, and see cash on hand, gross margin, A/R, A/P and days-to-collect.<\u002Fp>\n      <\u002Farticle>\n      <article style=\"outline:1px solid var(--line);background:#fff;padding:26px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)\">Documents<\u002Fdiv>\n        <h3 style=\"font-family:var(--display);font-weight:400;font-size:22px;line-height:1.2\">Every form, and when to send it<\u002Fh3>\n        <p style=\"font-size:13.5px;line-height:1.64;color:var(--ink-2);font-weight:300\">A shared document library organised by scenario — new client, partner, referral, quote — with the email already written. Send the set in one click.<\u002Fp>\n      <\u002Farticle>\n      <article style=\"outline:1px solid var(--line);background:#fff;padding:26px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)\">Event Hub<\u002Fdiv>\n        <h3 style=\"font-family:var(--display);font-weight:400;font-size:22px;line-height:1.2\">Client events &amp; RSVP pages<\u002Fh3>\n        <p style=\"font-size:13.5px;line-height:1.64;color:var(--ink-2);font-weight:300\">Design an animated invitation, publish a hosted RSVP page with personalised links, and track attending, awaiting and declined in real time.<\u002Fp>\n      <\u002Farticle>\n      <article style=\"outline:1px solid var(--line);background:#fff;padding:26px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)\">Prospect Lists<\u002Fdiv>\n        <h3 style=\"font-family:var(--display);font-weight:400;font-size:22px;line-height:1.2\">People you are chasing, organised<\u002Fh3>\n        <p style=\"font-size:13.5px;line-height:1.64;color:var(--ink-2);font-weight:300\">Bulk-paste a list, group by function or vertical, export to Excel, or email the whole list — shared with the team and always synced.<\u002Fp>\n      <\u002Farticle>\n      <article style=\"outline:1px solid var(--line);background:#fff;padding:26px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)\">Brand Studio<\u002Fdiv>\n        <h3 style=\"font-family:var(--display);font-weight:400;font-size:22px;line-height:1.2\">On-brand assets in any format<\u002Fh3>\n        <p style=\"font-size:13.5px;line-height:1.64;color:var(--ink-2);font-weight:300\">Email headers, signatures, LinkedIn banners, social cards and proposal covers — lockup and safe area set for you, legible on any image.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"automation\" style=\"padding:var(--sec-y-sm) 0;background:var(--paper);border-bottom:1px solid var(--line)\">\n  <div style=\"max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter-sm);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:48px;align-items:center\">\n    <div>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.SectionMarker\" label=\"Sales Automation\" hint-size=\"100%,16px\"><\u002Fx-import>\n      <h2 style=\"font-family:var(--display);font-weight:400;font-size:var(--fs-h-lg);line-height:1.1;letter-spacing:var(--ls-display);margin:24px 0 16px;max-width:24ch;text-wrap:balance\">Reps sell. <em style=\"color:var(--accent)\">The CRM keeps the record.<\u002Fem><\u002Fh2>\n      <p style=\"font-size:15px;line-height:1.7;color:var(--ink-2);font-weight:300;max-width:50ch;margin-bottom:20px\">Sales automation that removes the busywork and pushes the numbers to owners — instead of making them dig.<\u002Fp>\n      <ul style=\"list-style:none;padding:0;display:grid;gap:10px\">\n        <li style=\"display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14.5px;line-height:1.55;color:var(--ink-2);font-weight:300\"><span style=\"font-family:var(--mono);color:var(--accent)\">—<\u002Fspan><span>Every email sent or received is matched to the right contact and filed.<\u002Fspan><\u002Fli>\n        <li style=\"display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14.5px;line-height:1.55;color:var(--ink-2);font-weight:300\"><span style=\"font-family:var(--mono);color:var(--accent)\">—<\u002Fspan><span>Calls and meetings are captured, including ones logged after the fact.<\u002Fspan><\u002Fli>\n        <li style=\"display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14.5px;line-height:1.55;color:var(--ink-2);font-weight:300\"><span style=\"font-family:var(--mono);color:var(--accent)\">—<\u002Fspan><span>Replies are detected and flagged so no thread gets missed.<\u002Fspan><\u002Fli>\n        <li style=\"display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14.5px;line-height:1.55;color:var(--ink-2);font-weight:300\"><span style=\"font-family:var(--mono);color:var(--accent)\">—<\u002Fspan><span>A morning digest lands at 6:30am with what needs attention.<\u002Fspan><\u002Fli>\n        <li style=\"display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14.5px;line-height:1.55;color:var(--ink-2);font-weight:300\"><span style=\"font-family:var(--mono);color:var(--accent)\">—<\u002Fspan><span>Stale deals are chased before they go cold.<\u002Fspan><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--line);box-shadow:var(--sh-2);background:#fffdf9;padding:22px;min-width:0\" role=\"img\" aria-label=\"Sales team scoreboard with calls, emails and quotes per rep, and pipeline value by stage\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap\"><div style=\"font-family:var(--display);font-size:24px\">Scoreboard<\u002Fdiv><div style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--mute)\">THIS WEEK · ALL BRANDS<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:8px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--mute);padding:16px 0 8px;border-bottom:1px solid var(--line)\"><span>REP<\u002Fspan><span style=\"text-align:right\">CALLS<\u002Fspan><span style=\"text-align:right\">EMAILS<\u002Fspan><span style=\"text-align:right\">QUOTES<\u002Fspan><\u002Fdiv>\n      <sc-for list=\"{{ reps }}\" as=\"r\" hint-placeholder-count=\"3\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-3)\">\n          <div><div style=\"font-weight:600;font-size:14px\">{{ r.n }}<\u002Fdiv><div style=\"font-size:11.5px;color:var(--mute)\">{{ r.b }}<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:right;font-size:22px;color:var(--accent-2)\">{{ r.c }}<\u002Fdiv>\n          <div style=\"text-align:right;font-size:22px\">{{ r.e }}<\u002Fdiv>\n          <div style=\"text-align:right;font-size:22px\">{{ r.q }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--mute);margin:20px 0 10px\">PIPELINE · BY STAGE<\u002Fdiv>\n      <div style=\"display:grid;gap:10px\">\n        <sc-for list=\"{{ stages }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div><div style=\"display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px\"><span>{{ s.n }}<\u002Fspan><span style=\"font-family:var(--mono);font-size:12px;color:var(--ink-2)\">{{ s.v }}<\u002Fspan><\u002Fdiv><div style=\"height:6px;background:var(--paper-3);border:1px solid var(--line-3)\"><div style=\"height:100%;background:var(--accent);width:{{ s.w }}\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"prospecting\" style=\"position:relative;overflow:hidden;background:var(--ink);color:var(--on-dark);padding:var(--sec-y-sm) 0\">\n  <span style=\"position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 85% 20%,rgba(169,128,63,.22),transparent 45%),radial-gradient(circle at 10% 100%,rgba(169,128,63,.12),transparent 40%)\"><\u002Fspan>\n  <div style=\"position:relative;max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter-sm);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:48px;align-items:center\">\n    <div>\n      <div style=\"font-family:var(--mono);font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--accent-3);font-weight:500\">The differentiator · Automated lead generation<\u002Fdiv>\n      <h2 style=\"font-family:var(--display);font-weight:400;font-size:var(--fs-h-lg);line-height:1.1;letter-spacing:var(--ls-display);margin:20px 0 16px;max-width:24ch;text-wrap:balance\">It finds the next deal <em style=\"color:var(--accent-3)\">while your team sleeps.<\u002Fem><\u002Fh2>\n      <p style=\"font-size:15.5px;line-height:1.7;color:var(--on-dark-2);font-weight:300;max-width:52ch\">Configurable prospecting agents scan your market every business morning, detect buying signals, enrich the company and the right contacts, and add qualified prospects straight to the pipeline.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line-dark);border:1px solid var(--line-dark)\">\n      <div style=\"background:var(--ink);padding:22px\"><div style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--accent-3)\">01 · HUNT<\u002Fdiv><h3 style=\"font-family:var(--display);font-weight:400;font-size:20px;margin-top:8px\">Prospecting agents<\u002Fh3><p style=\"font-size:13px;line-height:1.6;color:var(--on-dark-2);font-weight:300;margin-top:6px\">Scan for target companies in your market.<\u002Fp><\u002Fdiv>\n      <div style=\"background:var(--ink);padding:22px\"><div style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--accent-3)\">02 · SIGNAL<\u002Fdiv><h3 style=\"font-family:var(--display);font-weight:400;font-size:20px;margin-top:8px\">Buying signals<\u002Fh3><p style=\"font-size:13px;line-height:1.6;color:var(--on-dark-2);font-weight:300;margin-top:6px\">Surface who is in-market right now.<\u002Fp><\u002Fdiv>\n      <div style=\"background:var(--ink);padding:22px\"><div style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--accent-3)\">03 · ENRICH<\u002Fdiv><h3 style=\"font-family:var(--display);font-weight:400;font-size:20px;margin-top:8px\">Contact enrichment<\u002Fh3><p style=\"font-size:13px;line-height:1.6;color:var(--on-dark-2);font-weight:300;margin-top:6px\">Firmographics and the right people.<\u002Fp><\u002Fdiv>\n      <div style=\"background:var(--ink);padding:22px\"><div style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--accent-3)\">04 · DELIVER<\u002Fdiv><h3 style=\"font-family:var(--display);font-weight:400;font-size:20px;margin-top:8px\">Daily scans<\u002Fh3><p style=\"font-size:13px;line-height:1.6;color:var(--on-dark-2);font-weight:300;margin-top:6px\">Fresh prospects every business morning.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"industries\" style=\"padding:var(--sec-y-sm) 0;border-bottom:1px solid var(--line)\">\n  <div style=\"max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter-sm)\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:24px 48px;align-items:end;margin-bottom:28px\">\n      <div>\n        <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.SectionMarker\" label=\"Who It Is For\" hint-size=\"100%,16px\"><\u002Fx-import>\n        <h2 style=\"font-family:var(--display);font-weight:400;font-size:var(--fs-h-md);line-height:1.12;letter-spacing:var(--ls-display);margin-top:24px;max-width:24ch;text-wrap:balance\">A CRM for small businesses that sell on relationships.<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font-size:15px;line-height:1.7;color:var(--ink-2);font-weight:300;max-width:52ch\">Configured to your stages, your documents and your brands — not a template built for someone else's sales floor.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:1px;padding:1px\" data-g6=\"\">\n      <a href=\"/real-estate-crm/\" style=\"outline:1px solid var(--line);padding:20px;background:#fff;display:flex;flex-direction:column;gap:8px;color:var(--ink);min-width:0\" style-hover=\"background:var(--accent-soft);color:var(--ink)\"><h3 style=\"font-family:var(--display);font-weight:400;font-size:19px;line-height:1.2\">CRM for real estate<\u002Fh3><p style=\"font-size:13px;line-height:1.6;color:var(--ink-2);font-weight:300;flex:1\">Referrals, open-house RSVPs, LOIs and multi-office brands.<\u002Fp><span style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)\">Read more →<\u002Fspan><\u002Fa>\n      <a href=\"/crm-for-agencies/\" style=\"outline:1px solid var(--line);padding:20px;background:#fff;display:flex;flex-direction:column;gap:8px;color:var(--ink);min-width:0\" style-hover=\"background:var(--accent-soft);color:var(--ink)\"><h3 style=\"font-family:var(--display);font-weight:400;font-size:19px;line-height:1.2\">CRM for agencies<\u002Fh3><p style=\"font-size:13px;line-height:1.6;color:var(--ink-2);font-weight:300;flex:1\">Proposals, campaigns and on-brand assets in one place.<\u002Fp><span style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)\">Read more →<\u002Fspan><\u002Fa>\n      <a href=\"/crm-for-consultants/\" style=\"outline:1px solid var(--line);padding:20px;background:#fff;display:flex;flex-direction:column;gap:8px;color:var(--ink);min-width:0\" style-hover=\"background:var(--accent-soft);color:var(--ink)\"><h3 style=\"font-family:var(--display);font-weight:400;font-size:19px;line-height:1.2\">CRM for consultants<\u002Fh3><p style=\"font-size:13px;line-height:1.6;color:var(--ink-2);font-weight:300;flex:1\">Engagement documents, introductions and partner credit.<\u002Fp><span style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)\">Read more →<\u002Fspan><\u002Fa>\n      <a href=\"#demo\" style=\"outline:1px solid var(--line);padding:20px;background:#fff;display:flex;flex-direction:column;gap:8px;color:var(--ink);min-width:0\" style-hover=\"background:var(--accent-soft);color:var(--ink)\"><h3 style=\"font-family:var(--display);font-weight:400;font-size:19px;line-height:1.2\">Professional services<\u002Fh3><p style=\"font-size:13px;line-height:1.6;color:var(--ink-2);font-weight:300;flex:1\">Quotes, e-signature, invoicing and receivables together.<\u002Fp><\u002Fa>\n      <a href=\"#demo\" style=\"outline:1px solid var(--line);padding:20px;background:#fff;display:flex;flex-direction:column;gap:8px;color:var(--ink);min-width:0\" style-hover=\"background:var(--accent-soft);color:var(--ink)\"><h3 style=\"font-family:var(--display);font-weight:400;font-size:19px;line-height:1.2\">Sales teams of 2–20<\u002Fh3><p style=\"font-size:13px;line-height:1.6;color:var(--ink-2);font-weight:300;flex:1\">Leaderboards, targets and automatic activity logging.<\u002Fp><\u002Fa>\n      <a href=\"#demo\" style=\"outline:1px solid var(--ink);padding:20px;background:var(--ink);display:flex;flex-direction:column;gap:8px;color:var(--on-dark);min-width:0\" style-hover=\"background:var(--accent);color:#fff\"><h3 style=\"font-family:var(--display);font-weight:400;font-size:19px;line-height:1.2;color:#fff\">Not on the list?<\u002Fh3><p style=\"font-size:13px;line-height:1.6;color:var(--on-dark-2);font-weight:300;flex:1\">Tell us how you sell. The build is configured to you.<\u002Fp><span style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-3)\">Book a demo →<\u002Fspan><\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:24px;align-items:center\">\n      <span style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-right:8px\">Integrates with<\u002Fspan>\n      <span style=\"font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line-2);padding:8px 12px\">Microsoft Outlook<\u002Fspan>\n      <span style=\"font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line-2);padding:8px 12px\">Microsoft Calendar<\u002Fspan>\n      <span style=\"font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line-2);padding:8px 12px\">DocuSign<\u002Fspan>\n      <span style=\"font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line-2);padding:8px 12px\">Apollo<\u002Fspan>\n      <span style=\"font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line-2);padding:8px 12px\">Excel / CSV<\u002Fspan>\n      <span style=\"font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line-2);padding:8px 12px\">Row-level security<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"pricing\" style=\"padding:var(--sec-y-sm) 0;background:var(--paper-2);border-bottom:1px solid var(--line)\">\n  <div style=\"max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter-sm)\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:24px 48px;align-items:end;margin-bottom:36px\">\n      <div>\n        <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.SectionMarker\" label=\"CRM Pricing\" hint-size=\"100%,16px\"><\u002Fx-import>\n        <h2 style=\"font-family:var(--display);font-weight:400;font-size:var(--fs-h-md);line-height:1.12;letter-spacing:var(--ls-display);margin-top:24px;max-width:24ch;text-wrap:balance\">Custom-built and licensed. <em style=\"color:var(--accent)\">Priced to your business.<\u002Fem><\u002Fh2>\n        <sc-if value=\"{{ showPrice }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;align-items:baseline;gap:12px;margin-top:22px;flex-wrap:wrap\"><span style=\"font-family:var(--mono);font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--mute)\">Starting at<\u002Fspan><span style=\"font-family:var(--display);font-size:clamp(48px,5.5vw,68px);line-height:1\">$20,000<\u002Fspan><span style=\"font-size:14px;color:var(--ink-2);font-weight:300\">per year<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px;align-items:flex-start\">\n        <p style=\"font-size:15px;line-height:1.7;color:var(--ink-2);font-weight:300;max-width:52ch\">One engagement replaces the CRM, email marketing, document, invoicing and prospecting subscriptions. Optional support is available on top. Final pricing is set after the demo.<\u002Fp>\n        <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Button\" variant=\"solid\" href=\"#demo\" hint-size=\"160px,52px\">Get my price →<\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:1px;padding:1px\" data-g3=\"\">\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Tier\" n=\"Step 01\" headline=\"Demo\" sub=\"20 minutes · no obligation\" style=\"{{ cellStyle }}\" hint-size=\"100%,200px\">We look at how you sell today, what you pay for, and what your team actually uses.<\u002Fx-import>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Tier\" n=\"Step 02\" headline=\"Build\" sub=\"Configured to you\" highlight=\"{{ true }}\" style=\"{{ cellStyle }}\" hint-size=\"100%,200px\">Stages, brands, mailboxes, templates, documents and credit rules — set up the way you run.<\u002Fx-import>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Tier\" n=\"Step 03\" headline=\"License\" sub=\"Annual · every capability\" style=\"{{ cellStyle }}\" hint-size=\"100%,200px\">One license for the full platform. No tiers to decode and no add-ons to unlock the basics.<\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"faq\" style=\"padding:var(--sec-y-sm) 0;border-bottom:1px solid var(--line)\">\n  <div style=\"max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter-sm);display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start\">\n    <div style=\"flex:1 1 280px;max-width:380px\" data-sticky=\"\">\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.SectionMarker\" label=\"Before You Reach Out\" hint-size=\"100%,16px\"><\u002Fx-import>\n      <h2 style=\"font-family:var(--display);font-weight:400;font-size:var(--fs-h-md);line-height:1.12;letter-spacing:var(--ls-display);margin:24px 0 16px\">Small business CRM questions, <em style=\"color:var(--accent)\">answered.<\u002Fem><\u002Fh2>\n      <p style=\"font-size:14px;line-height:1.7;color:var(--ink-2);font-weight:300;margin-bottom:20px\">Anything else is faster to answer on a 20-minute call.<\u002Fp>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Button\" variant=\"outline\" href=\"#demo\" hint-size=\"170px,48px\">Ask on the demo →<\u002Fx-import>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid var(--line-2);flex:2 1 520px;min-width:0\">\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.FaqItem\" n=\"01\" question=\"Is Counteroffer a Salesforce alternative for small business?\" hint-size=\"100%,72px\"><p style=\"font-size:14px;line-height:1.74;color:var(--ink-2);font-weight:300\">Yes. It covers the contacts, pipeline, activity tracking and reporting small teams buy Salesforce for, plus the email marketing, document, invoicing and prospecting tools usually bought separately — configured to your process instead of an enterprise template.<\u002Fp><\u002Fx-import>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.FaqItem\" n=\"02\" question=\"How is it different from HubSpot?\" hint-size=\"100%,72px\"><p style=\"font-size:14px;line-height:1.74;color:var(--ink-2);font-weight:300\">HubSpot is sold by hub and tier, so cost rises as you add automation, reporting and users. Counteroffer is one custom build and one annual license covering the full platform.<\u002Fp><\u002Fx-import>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.FaqItem\" n=\"03\" question=\"Will the CRM carry our brand?\" hint-size=\"100%,72px\"><p style=\"font-size:14px;line-height:1.74;color:var(--ink-2);font-weight:300\">Yes. Every Counteroffer build is white-labelled to your company: your name, logo, colours and mailboxes. Your team logs into your CRM, not ours.<\u002Fp><\u002Fx-import>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.FaqItem\" n=\"04\" question=\"How much does Counteroffer cost?\" hint-size=\"100%,72px\"><p style=\"font-size:14px;line-height:1.74;color:var(--ink-2);font-weight:300\">Pricing starts at $20,000 per year for the custom build and license, with optional support available. Final pricing is set after a demo, based on your brands, team and workflow.<\u002Fp><\u002Fx-import>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.FaqItem\" n=\"05\" question=\"Does it work with Outlook and Microsoft Calendar?\" hint-size=\"100%,72px\"><p style=\"font-size:14px;line-height:1.74;color:var(--ink-2);font-weight:300\">Yes. Each rep connects their own mailbox once; sent and received mail flows into the CRM every few minutes and calendars stay in sync every 15 minutes.<\u002Fp><\u002Fx-import>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.FaqItem\" n=\"06\" question=\"Does it include invoicing and e-signature?\" hint-size=\"100%,72px\"><p style=\"font-size:14px;line-height:1.74;color:var(--ink-2);font-weight:300\">Yes. Send letters of intent, invoices and purchase orders with view tracking, and send agreements through DocuSign with the signed result recorded on the deal.<\u002Fp><\u002Fx-import>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.FaqItem\" n=\"07\" question=\"Can we run more than one company in it?\" hint-size=\"100%,72px\"><p style=\"font-size:14px;line-height:1.74;color:var(--ink-2);font-weight:300\">Yes. Each brand keeps its own look, mailboxes and team, and the leaderboard rolls activity up across all of them.<\u002Fp><\u002Fx-import>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.FaqItem\" n=\"08\" question=\"Will my team actually use it?\" hint-size=\"100%,72px\"><p style=\"font-size:14px;line-height:1.74;color:var(--ink-2);font-weight:300\">They barely have to. Emails, calls and meetings are logged automatically, replies are flagged, stale deals are chased, and a morning digest tells each rep what needs attention.<\u002Fp><\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"demo\" style=\"position:relative;overflow:hidden;background:var(--paper-3);padding:var(--sec-y-sm) 0\">\n  <span aria-hidden=\"true\" data-bg-grid=\"\" style=\"position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(var(--line-3) 1px,transparent 1px),linear-gradient(90deg,var(--line-3) 1px,transparent 1px);background-size:86px 86px;-webkit-mask-image:radial-gradient(ellipse 50% 80% at 100% 50%,#000,transparent 75%);mask-image:radial-gradient(ellipse 50% 80% at 100% 50%,#000,transparent 75%)\"><\u002Fspan>\n  <div style=\"position:relative;max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter-sm);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:48px;align-items:center\">\n    <div>\n      <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Kicker\" hint-size=\"auto,14px\">20-minute demo · Your counteroffer, in writing<\u002Fx-import>\n      <h2 style=\"font-family:var(--display);font-weight:400;font-size:var(--fs-h-lg);line-height:1.1;letter-spacing:var(--ls-display);margin:20px 0 16px;max-width:24ch;text-wrap:balance\">See it on a pipeline like yours. <em style=\"color:var(--accent)\">Not a canned deck.<\u002Fem><\u002Fh2>\n      <p style=\"font-size:15.5px;line-height:1.7;color:var(--ink-2);font-weight:300;max-width:48ch;margin-bottom:22px\">Tell us what you use today. You leave with a view of your stack consolidated into one system, and what it takes to build it.<\u002Fp>\n      <div style=\"border-top:1px solid var(--line-2)\">\n        <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.NumberedRow\" dc-props=\"{{ rowProps }}\" n=\"01\" kicker=\"Map\" title=\"How you sell today\" hint-size=\"100%,80px\">Your stages, team, brands and tools.<\u002Fx-import>\n        <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.NumberedRow\" dc-props=\"{{ rowProps }}\" n=\"02\" kicker=\"Show\" title=\"The platform, live\" hint-size=\"100%,80px\">Shaped to your business, not a script.<\u002Fx-import>\n        <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.NumberedRow\" dc-props=\"{{ rowProps }}\" n=\"03\" kicker=\"Counter\" title=\"Your counteroffer, in writing\" hint-size=\"100%,80px\">Your current stack redlined, ours beside it.<\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.InquiryPanel\" note=\"No obligation · We reply within one business day\" hint-size=\"100%,520px\">\n      <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n        <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"display:grid;gap:16px\">\n          <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Field\" label=\"Full name\" required=\"{{ true }}\" value=\"{{ f.name }}\" on-change=\"{{ set.name }}\" hint-size=\"100%,64px\"><\u002Fx-import>\n          <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Field\" label=\"Work email\" type=\"email\" required=\"{{ true }}\" value=\"{{ f.email }}\" on-change=\"{{ set.email }}\" hint-size=\"100%,64px\"><\u002Fx-import>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px\">\n            <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Field\" label=\"Company\" value=\"{{ f.company }}\" on-change=\"{{ set.company }}\" hint-size=\"100%,64px\"><\u002Fx-import>\n            <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Field\" label=\"Team size\" type=\"select\" options=\"{{ sizes }}\" value=\"{{ f.size }}\" on-change=\"{{ set.size }}\" hint-size=\"100%,64px\"><\u002Fx-import>\n          <\u002Fdiv>\n          <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Field\" label=\"What do you use today?\" placeholder=\"Salesforce, HubSpot, spreadsheets…\" value=\"{{ f.stack }}\" on-change=\"{{ set.stack }}\" hint-size=\"100%,64px\"><\u002Fx-import>\n          <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Button\" variant=\"solid\" type=\"submit\" full=\"{{ true }}\" hint-size=\"100%,52px\">{{ btnLabel }}<\u002Fx-import>\n          <sc-if value=\"{{ error }}\" hint-placeholder-val=\"{{ false }}\"><p role=\"alert\" style=\"font-size:13px;color:var(--accent-2);font-weight:400\">{{ error }}<\u002Fp><\u002Fsc-if>\n          <input type=\"checkbox\" name=\"botcheck\" tabindex=\"-1\" autocomplete=\"off\" aria-hidden=\"true\" style=\"display:none\">\n        <\u002Fform>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:30px 0;display:grid;gap:14px\">\n          <x-import component-from-global-scope=\"ChiefNegotiatorsDesignSystem_df8de8.Kicker\" hint-size=\"auto,14px\">Request received<\u002Fx-import>\n          <div style=\"font-family:var(--display);font-size:32px;line-height:1.15\">Thank you. <em style=\"color:var(--accent)\">We will be in touch.<\u002Fem><\u002Fdiv>\n          <p style=\"font-size:14px;line-height:1.7;color:var(--ink-2);font-weight:300\">Expect an email within one business day to pick a time. Have your current software invoices to hand.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fx-import>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n\n<footer style=\"background:var(--paper-2);padding:48px 0 32px;border-top:1px solid var(--line)\">\n  <div style=\"max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter-sm)\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:40px;justify-content:space-between\">\n      <div style=\"max-width:340px;display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;align-items:center;gap:14px;line-height:1\"><span aria-hidden=\"true\" style=\"width:54px;height:54px;background:var(--ink);display:grid;place-items:center;font-family:'Segoe UI Symbol','Apple Symbols','Noto Sans Symbols 2','DejaVu Sans',serif;line-height:1;font-size:36px;color:var(--accent-3);flex:none\">♛︎<\u002Fspan><span style=\"display:flex;flex-direction:column\"><span style=\"font-family:var(--sans);font-weight:600;font-size:32px;line-height:1;letter-spacing:-.045em;color:var(--ink);white-space:nowrap\">counter<span style=\"color:var(--accent)\">offer<\u002Fspan><\u002Fspan><span style=\"font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin-top:5px;display:block\">by The Chief Negotiators<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <p style=\"font-size:13px;line-height:1.68;color:var(--ink-2);font-weight:300\">Counteroffer — the custom-built, white-label CRM for small business. Pipeline, email marketing, quotes, invoicing, e-signature and automated prospecting, branded as your own.<\u002Fp>\n      <\u002Fdiv>\n      <nav aria-label=\"Footer\" style=\"display:flex;gap:48px;flex-wrap:wrap\">\n        <div style=\"display:flex;flex-direction:column\"><p style=\"font-family:var(--mono);font-weight:500;font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:var(--accent);margin-bottom:14px\">Solutions<\u002Fp><a href=\"/real-estate-crm/\" style=\"font-size:13px;color:var(--ink-2);font-weight:300;padding:11px 0\">Real estate CRM<\u002Fa><a href=\"/crm-for-agencies/\" style=\"font-size:13px;color:var(--ink-2);font-weight:300;padding:11px 0\">CRM for agencies<\u002Fa><a href=\"/crm-for-consultants/\" style=\"font-size:13px;color:var(--ink-2);font-weight:300;padding:11px 0\">CRM for consultants<\u002Fa><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column\"><p style=\"font-family:var(--mono);font-weight:500;font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:var(--accent);margin-bottom:14px\">Platform<\u002Fp><a href=\"#features\" style=\"font-size:13px;color:var(--ink-2);font-weight:300;padding:11px 0\">CRM features<\u002Fa><a href=\"#modules\" style=\"font-size:13px;color:var(--ink-2);font-weight:300;padding:11px 0\">Invoicing &amp; finance<\u002Fa><a href=\"#automation\" style=\"font-size:13px;color:var(--ink-2);font-weight:300;padding:11px 0\">Sales automation<\u002Fa><a href=\"#prospecting\" style=\"font-size:13px;color:var(--ink-2);font-weight:300;padding:11px 0\">Automated prospecting<\u002Fa><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column\"><p style=\"font-family:var(--mono);font-weight:500;font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:var(--accent);margin-bottom:14px\">Compare<\u002Fp><a href=\"/salesforce-alternative/\" style=\"font-size:13px;color:var(--ink-2);font-weight:300;padding:11px 0\">Salesforce alternative<\u002Fa><a href=\"/hubspot-alternative/\" style=\"font-size:13px;color:var(--ink-2);font-weight:300;padding:11px 0\">HubSpot alternative<\u002Fa><a href=\"#pricing\" style=\"font-size:13px;color:var(--ink-2);font-weight:300;padding:11px 0\">CRM pricing<\u002Fa><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column\"><p style=\"font-family:var(--mono);font-weight:500;font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:var(--accent);margin-bottom:14px\">Get in touch<\u002Fp><a href=\"#demo\" style=\"font-size:13px;color:var(--ink-2);font-weight:300;padding:11px 0\">Book a demo<\u002Fa><a href=\"/white-label-crm/\" style=\"font-size:13px;color:var(--ink-2);font-weight:300;padding:11px 0\">White-label CRM<\u002Fa><a href=\"#faq\" style=\"font-size:13px;color:var(--ink-2);font-weight:300;padding:11px 0\">FAQ<\u002Fa><\u002Fdiv>\n      <\u002Fnav>\n    <\u002Fdiv>\n    <div style=\"margin-top:36px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-family:var(--mono);font-weight:500;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--mute)\">\n      <span>© 2026 Chief Negotiators LLC · St. Petersburg, Florida<\u002Fspan><span>Your CRM made you an offer. This is yours.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showPrice&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showCostMath&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { submitted: false, sending: false, error: '', f: { name: '', email: '', company: '', size: '1–5', stack: '' }, narrow: typeof window !== 'undefined' && window.innerWidth < 720 };\n  componentDidMount() { this._rs = () => { const n = window.innerWidth < 720; if (n !== this.state.narrow) this.setState({ narrow: n }); }; window.addEventListener('resize', this._rs); }\n  componentWillUnmount() { window.removeEventListener('resize', this._rs); }\n  renderVals() {\n    const submitted = this.state.submitted;\n    return {\n      showPrice: this.props.showPrice ?? true,\n      showCostMath: this.props.showCostMath ?? true,\n      nul: null,\n      wide: !this.state.narrow,\n      rowProps: { style: this.state.narrow ? { gridTemplateColumns: 'minmax(0,1fr)', gap: 8, padding: '22px 0' } : { gridTemplateColumns: '64px minmax(0,1fr) minmax(0,1.08fr)' } },\n      cellStyle: { outline: '1px solid var(--line)' },\n      navLinks: [{ label: 'Compare', href: '#cost' }, { label: 'Features', href: '#features' }, { label: 'Modules', href: '#modules' }, { label: 'Pricing', href: '#pricing' }, { label: 'FAQ', href: '#faq' }],\n      kpis: [\n        { l: 'OPEN PIPELINE', v: '$1.42M', s: '18 live deals', c: 'var(--ink)' },\n        { l: 'FORECAST', v: '$186K', s: 'this month', c: 'var(--ink)' },\n        { l: 'CLOSED · QTD', v: '$240K', s: '9 won', c: 'var(--ink)' },\n        { l: 'COMMISSION', v: '$19.2K', s: 'deposits in', c: 'var(--accent)' },\n        { l: 'WIN RATE', v: '34%', s: 'last 90 days', c: 'var(--ink)' },\n        { l: 'EMAILS LOGGED', v: '412', s: 'automatically', c: 'var(--ink)' }\n      ],\n      prospects: [\n        { n: 'Harborline Realty', d: 'Brokerage · 40 agents', s: 'Opened a second office' },\n        { n: 'Pinecrest Advisory', d: 'Consulting · 12 staff', s: 'Hiring two sales roles' },\n        { n: 'Meridian Studio', d: 'Agency · 25 staff', s: 'New funding announced' }\n      ],\n      reps: [\n        { n: 'Jordan Lee', b: 'Brand A', c: 31, e: 118, q: 6 },\n        { n: 'Sam Rivera', b: 'Brand B', c: 24, e: 96, q: 4 },\n        { n: 'Priya Shah', b: 'Brand A', c: 19, e: 74, q: 3 }\n      ],\n      stages: [\n        { n: 'Intro call', v: '6 · $210K', w: '30%' }, { n: 'Proposal', v: '5 · $480K', w: '68%' },\n        { n: 'Negotiate', v: '4 · $520K', w: '74%' }, { n: 'Closed won', v: '9 · $240K', w: '34%' }\n      ],\n      sizes: ['1–5', '6–15', '16–50', '50+'],\n      submitted, notSubmitted: !submitted,\n      f: this.state.f,\n      set: this._set || (this._set = Object.fromEntries(['name','email','company','size','stack'].map(k => [k, e => { const v = e.target.value; this.setState(s => ({ f: { ...s.f, [k]: v } })); }]))),\n      btnLabel: this.state.sending ? 'Sending…' : 'Book my demo →',\n      error: this.state.error,\n      onSubmit: async e => {\n        e.preventDefault();\n        if (this.state.sending) return;\n        if (e.target.botcheck && e.target.botcheck.checked) return;\n        const f = this.state.f;\n        this.setState({ sending: true, error: '' });\n        try {\n          const r = await fetch('https://api.web3forms.com/submit', { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ access_key: '72c7f5b3-6a14-43c2-9709-e57876df34f9', subject: 'Counteroffer demo request — ' + (f.company || f.name), from_name: 'Counteroffer website', name: f.name, email: f.email, company: f.company, team_size: f.size, current_crm: f.stack, message: 'Demo request from ' + f.name + (f.company ? ' at ' + f.company : '') + '. Team size: ' + f.size + '. Uses today: ' + (f.stack || 'not given') + '.' }) });\n          const j = await r.json();\n          if (!j.success) throw new Error(j.message || 'Failed');\n          if (window.gtag) window.gtag('event', 'generate_lead', { form: 'demo', team_size: f.size });\n          this.setState({ submitted: true, sending: false });\n        } catch (err) {\n          this.setState({ sending: false, error: 'That did not send. Email amanda@thechiefnegotiators.com and we will book it directly.' });\n        }\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
